name = "Protect cookies with the App Sandbox"
status = "blocked"
description = """
Any process running as Mark can read every Space's logins: WebKit keeps them as plain files in ~/Library/WebKit/com.nih-industries.adequate/WebsiteDataStore/<space id>/Cookies, and a shell lists them with no prompt. A bad npm postinstall or gem could lift every logged-in session from every Space. Safari's data sits behind macOS privacy protection; Chrome encrypts cookies with a key in the keychain.

## Fix
Turn on the App Sandbox. A sandboxed app's data moves into ~/Library/Containers/com.nih-industries.adequate, and macOS (14+) asks before another app reads a container (App Data protection). We can't encrypt WebKit's cookie store ourselves, so the sandbox is the lever.

## Blocked on
- Apple Developer Program membership and Developer ID signing with hardened runtime (the make release work, same as the cask and passkeys). Check whether ad-hoc signing with sandbox entitlements is enough to try it locally first.

## What the sandbox will fight
- **Data moves**: Spaces' data stores, spaces.json, history and cli-token move into the container. Migrate the old files on first launch, or every Space logs out.
- **The adequate CLI** reads cli-token and spaces.json from ~/Library/Application Support/Adequate. It can't see into the container without permission: maybe an app group container both can read, or have the app answer the CLI some other way.
- **Opening local files**: Finder and open hand us the file itself (fine), but a page's own folder (report images, coverage/) needs a security-scoped grant or a user-selected read entitlement. Typing a file:// address in the address bar won't work without one.
- **Entitlements needed**: com.apple.security.network.client, device.camera, device.audio-input, files.user-selected.read-only, files.downloads.read-write if downloads arrive, print. Check screen sharing (getDisplayMedia) and notifications still work.
- **Private WebKit APIs** (inspector, media capture switches) should be unaffected, but check.

## Notes
- From the security review on 2026-11-17, along with the quick fixes that shipped (site label, asking before opening apps, safe default answers, file read access)."""
