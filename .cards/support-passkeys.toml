name = "Support passkeys"
status = "blocked"
description = """
Passkeys (WebAuthn) don't work in Adequate: WKWebView only runs navigator.credentials for any site when the app has Apple's permission, and the ad-hoc signed build has none. For now, sign in with credentials copied from 1Password or Authy.

## Blocked on
- Apple Developer Program membership (same blocker as the Homebrew cask).

## What it takes
1. Request the managed entitlement com.apple.developer.web-browser.public-key-credential from Apple. It's for apps that act as browsers (Adequate can be the default browser). Apple has to approve it and add it to a provisioning profile.
2. Developer ID signing with that profile embedded, plus hardened runtime (part of the make release work). Keep the camera and microphone entitlements or video calls break.
3. Then WebKit's own WebAuthn should use the system passkey sheet: iCloud Keychain, 1Password as a passkey provider, phone via QR code, and security keys. Probably little or no WebAuthn code of our own. ASAuthorizationWebBrowserPublicKeyCredentialManager is there if we ever want our own account picker.

## Notes
- Passkeys live in the keychain or 1Password, not a Space's cookie store, so every Space sees the same passkeys. Logins stay per Space.
- Untested: not yet checked against a real signed build. The open question is whether Apple grants the entitlement to a one-person indie browser.
- Without the entitlement, WebAuthn works only for domains claimed through webcredentials associated domains, which means our own sites only."""
