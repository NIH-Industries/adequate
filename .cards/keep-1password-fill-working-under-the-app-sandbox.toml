name = "Keep 1Password fill working under the App Sandbox"
status = "todo"
description = """
⌘⇧P fills logins by spawning 1Password's CLI (`op`, found at /opt/homebrew/bin or /usr/local/bin) with responsibility_spawnattrs_setdisclaim, so macOS judges op as itself and lets it read 1Password's group container (where the CLI integration setting lives). Adopting the App Sandbox (the "Protect cookies with the App Sandbox" card) would very likely break this, so the two need planning together.

## Why the sandbox breaks it
- A sandboxed app can only spawn executables inside its own bundle, or ones the user picked, and whatever it spawns inherits its sandbox.
- A sandboxed op wouldn't be allowed into 1Password's group container (2BUA8C4S2C.com.1password) or its integration socket, so it would report no accounts, the same failure we hit before the disclaim fix.
- The disclaim trick is about privacy checks (TCC), not the sandbox, so it doesn't help here.

## Options to look into
1. Check first: confirm the breakage with a sandboxed test build before designing around it (Untested: this is reasoning, not a run).
2. A non-sandboxed helper: a small login item or XPC service, outside the sandbox, that runs op and hands back only what's needed. It would need its own signing, and it widens what the app can do again, so weigh it against the cookie protection the sandbox buys.
3. Temporary exception entitlements (com.apple.security.temporary-exception.*) for the group container: Apple frowns on these, and they may not cover spawning op at all.
4. 1Password's SDKs (service accounts or the desktop-app integration in their SDK) instead of the CLI: check whether their desktop integration works from a sandboxed app.
5. Choose: keep cookies unsandboxed and keep ⌘⇧P, or sandbox and go back to copy and paste from Quick Access.

## Notes
- Related: Protect cookies with the App Sandbox, Support passkeys (also needs Developer ID signing).
- The fill script and the site matching don't depend on how op is run: only OnePassword.run / spawn would change."""
