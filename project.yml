name: Adequate
options:
  bundleIdPrefix: com.nih-industries
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # Blocks code injection into a running Adequate (it holds logins and a
    # 1Password session). Works with ad-hoc signing. Anything that needs a
    # protected resource needs its entitlement below, or it's silently refused.
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode leaves the runtime off when ad-hoc signing, so the Makefile signs
    # the app again with it. One binary (no separate debug dylib, which only
    # SwiftUI previews want), and no get-task-allow, which would let any
    # program running as you attach a debugger.
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Adequate:
    type: application
    platform: macOS
    sources: [Adequate]
    entitlements:
      path: Adequate/Adequate.entitlements
      properties:
        # Video calls (getUserMedia) and maps (PageLocation).
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    info:
      path: Adequate/Info.plist
      properties:
        CFBundleDisplayName: Adequate
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "NIH Industries"
        NSCameraUsageDescription: "Web pages you allow, like video calls, can use your camera."
        NSMicrophoneUsageDescription: "Web pages you allow, like video calls, can use your microphone."
        NSLocationUsageDescription: "Web pages you allow, like maps, can use your location."
        NSLocationWhenInUseUsageDescription: "Web pages you allow, like maps, can use your location."
        CFBundleURLTypes:
          - CFBundleURLName: com.nih-industries.adequate
            CFBundleURLSchemes: [adequate]
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nih-industries.adequate
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
